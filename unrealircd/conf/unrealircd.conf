/* UnifiedCore Hub - hub.unifiedcore.org */

include "snomasks.default.conf";
include "modules.default.conf";
include "aliases/anope.conf";
include "help/help.conf";
include "badwords.conf";
include "spamfilter.conf";
include "operclass.default.conf";
include "opers.conf";
loadmodule "cloak_sha256";

me {
    name "hub.unifiedcore.org";
    info "UnifiedCore Hub";
    sid "001";
};

admin {
    "UnifiedCore Admin";
    "admin";
    "admin@unifiedcore.org";
};

class clients {
    pingfreq 90;
    maxclients 100;
    sendq 200k;
    recvq 8000;
};

class servers {
    pingfreq 60;
    maxclients 10;
    sendq 20M;
    connfreq 60;
};

except ban {
    mask *@127.0.0.1;
    type { connect-flood; maxperip; };
};

except ban {
    mask *@localhost;
    type { connect-flood; maxperip; };
};

allow {
    mask *@127.0.0.1;
    class clients;
    maxperip 50;
};

allow {
    mask *@localhost;
    class clients;
    maxperip 50;
};

allow {
    mask *@*;
    class clients;
    maxperip 3;
};

oper admin {
    class clients;
    mask *@127.0.0.1;
    password "<REDACTED — see SECRETS.md>";
    operclass netadmin;
    require-modes +z;
};

oper botmgr {
    class clients;
    mask *@localhost;
    password "<REDACTED — see SECRETS.md>";
    operclass netadmin;
};

listen {
    ip 0.0.0.0;
    port 6697;
    options { tls; };
};

listen {
    ip 0.0.0.0;
    port 7029;
    options { tls; serversonly; };
};

listen {
    ip 127.0.0.1;
    port 7030;
    options { serversonly; };
};

set {
    connthrottle {
        new-users {
            local-throttle 100:60;
            global-throttle 100:60;
        };
    };
};

set {
    network-name "UnifiedCore";
    default-server "hub.unifiedcore.org";
    services-server "services.unifiedcore.org";
    help-channel "#help";
    hiddenhost-prefix "UC";
    kline-address "admin@unifiedcore.org";
cloak-keys {
                "<REDACTED — see SECRETS.md>";
                "<REDACTED — see SECRETS.md>";
                "<REDACTED — see SECRETS.md>";
        }

cloak-prefix "unifiedcore";

    tls {
        certificate "/etc/letsencrypt/live/unifiedcore.org/fullchain.pem";
        key "/etc/letsencrypt/live/unifiedcore.org/privkey.pem";
    };
};

link services.unifiedcore.org {
    incoming {
        mask 127.0.0.1;
    };
    password "<REDACTED — see SECRETS.md>";
    class servers;
};

ulines {
    services.unifiedcore.org;
};

link usc.unifiedcore.org {
    incoming {
        mask 38.22.140.61;
    };
    password "<REDACTED — see SECRETS.md>";
    class servers;
};

link can.unifiedcore.org {
    incoming {
        mask 38.102.127.120;
    };
    password "<REDACTED — see SECRETS.md>";
    class servers;
};

link eu.unifiedcore.org {
    incoming {
        mask *;
    };
    password "<REDACTED — see SECRETS.md>";
    class servers;
};


link wsc.unifiedcore.org {
    incoming {
        mask *@23.238.57.132;
    };
    password "<REDACTED — see SECRETS.md>";
    class servers;
};
